<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 NAS · 正在进入</title>
<style>
  body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
  .card{text-align:center;padding:32px;max-width:460px;width:100%}
  .spin{width:42px;height:42px;border:4px solid #334155;border-top-color:#38bdf8;border-radius:50%;margin:0 auto 22px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  h1{font-size:20px;margin:0 0 10px}
  p{color:#94a3b8;font-size:14px;line-height:1.6}
  a{color:#38bdf8;word-break:break-all}
  .btns{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  button{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:10px 18px;border-radius:8px;font-size:14px}
  button.primary{background:#38bdf8;color:#0f172a;border-color:#38bdf8;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="spin" id="spin"></div>
  <h1>正在进入我的 NAS</h1>
  <p id="status">正在检测网络，优先使用高速局域网…</p>
  <div class="btns" id="btns" style="display:none">
    <button class="primary" onclick="go(lanUrl)">在家 · 高速局域网</button>
    <button onclick="usePublic()">出门 · 公网</button>
  </div>
  <p id="manual" style="display:none;margin-top:18px">如果没有自动跳转，点上面按钮，或<a id="go" href="#">点这里</a></p>
</div>
<script>
var lanUrl = 'http://192.168.0.100:5244';
var status = document.getElementById('status');
var btns = document.getElementById('btns');
var manual = document.getElementById('manual');
var goLink = document.getElementById('go');
var timedOut = false;

function go(url){
  url = (url||'').trim();
  if(!url) return;
  goLink.href = url;
  manual.style.display = 'block';
  status.textContent = '正在跳转：' + url;
  window.location.replace(url);
}

function withTimeout(p, ms){
  return Promise.race([
    p,
    new Promise(function(_, reject){ setTimeout(function(){ timedOut=true; reject(new Error('timeout')); }, ms); })
  ]);
}

// 探测局域网：no-cors，能 resolve(opaque) 即视为可达
function probeLan(){
  return fetch(lanUrl + '/ping?_=' + Date.now(), { mode:'no-cors', cache:'no-store' });
}

function usePublic(){
  status.textContent = '正在获取公网地址…';
  fetch('current.txt?_=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(go)
    .catch(function(e){
      status.textContent = '获取公网地址失败：' + e.message;
      btns.style.display = 'flex';
    });
}

withTimeout(probeLan(), 2500)
  .then(function(){
    status.textContent = '检测到家庭网络，走高速局域网…';
    go(lanUrl);
  })
  .catch(function(){
    // 局域网不通（或被安全策略拦截），自动走公网；同时显示手动按钮兜底
    btns.style.display = 'flex';
    usePublic();
  });
</script>
</body>
</html>
