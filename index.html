<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 NAS · 正在进入</title>
<style>
  body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
  .card{text-align:center;padding:32px;max-width:420px}
  .spin{width:42px;height:42px;border:4px solid #334155;border-top-color:#38bdf8;border-radius:50%;margin:0 auto 22px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  h1{font-size:20px;margin:0 0 10px}
  p{color:#94a3b8;font-size:14px;line-height:1.6}
  a{color:#38bdf8;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <div class="spin" id="spin"></div>
  <h1>正在进入我的 NAS</h1>
  <p id="status">正在获取当前地址，请稍候…</p>
  <p id="manual" style="display:none">如果没有自动跳转，<a id="go" href="#">点这里进入</a></p>
</div>
<script>
(function(){
  var status = document.getElementById('status');
  var manual = document.getElementById('manual');
  var go = document.getElementById('go');
  function enter(url){
    url = (url||'').trim();
    if(!url){ status.textContent = '地址为空，请稍后重试'; return; }
    go.href = url;
    manual.style.display = 'block';
    status.textContent = '即将跳转…';
    window.location.replace(url);
  }
  fetch('current.txt?_=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(enter)
    .catch(function(e){
      status.textContent = '获取地址失败：' + e.message;
      manual.style.display = 'block';
    });
})();
</script>
</body>
</html>
